<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sudoku</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Criação do container principal -->
    <div class="container">

        <button id="temaClaroEscuro">🌙</button>
        <h1 class="titulo-h1">Sudoku</h1>

        <!-- Div da barra superior com o cronômetro -->
        <div class="top">
            <span id="timer">00:00</span>
        </div>
        
        <!-- Div onde o javascript cria as 81 célunas do Sudoku -->
        <div id="board"></div>

        <!-- Teclado numérico para dispositivos móveis, permite inserir números no Sudoku sem depender do teclado virtual do celular. -->
        <div id="teclado-numerico">
            <button class="numero-btn">1</button>
            <button class="numero-btn">2</button>
            <button class="numero-btn">3</button>
            <button class="numero-btn">4</button>
            <button class="numero-btn">5</button>
            <button class="numero-btn">6</button>
            <button class="numero-btn">7</button>
            <button class="numero-btn">8</button>
            <button class="numero-btn">9</button>
        </div>

        <!-- Div onde agrupa os botões do site -->
        <div class="buttons">
            <button id="new-game" type="button">Novo Jogo</button>
            <button id="undo">Desfazer</button>
            <button id="erase">Apagar</button>
            <button id="hint">Dica</button>
            <button id="check">Verificar</button>
        </div>
        
        <!-- Exibe o contador de dicas restantes -->
        <p class="dicas">Dicas Restantes <span id="hints">3</span></p>

        <!-- Mensagem de status (jogo concluído / tabuleiro com repetidos) -->
        <p id="status-jogo" class="status-jogo" role="status" aria-live="polite" hidden></p>
        
    
    </div>

    <!-- Modal de vitória: etapa 1 = mensagem, etapa 2 = deseja continuar? -->
    <div id="modal-vitoria" class="modal" hidden>
        <div id="modal-caixa" class="modal-caixa" role="dialog" aria-modal="true" aria-labelledby="modal-titulo">
            <div id="etapa-vitoria">
                <h2 id="modal-titulo">🎉 Parabéns!</h2>
                <p id="modal-mensagem"></p>
                <button id="btn-continuar" type="button">Continuar</button>
            </div>
            <div id="etapa-pergunta" hidden>
                <h2 id="modal-pergunta">Deseja continuar jogando?</h2>
                <p>Escolha "Sim" para ir à seleção de dificuldade ou "Não" para ficar nesta tela.</p>
                <div class="modal-acoes">
                    <button id="btn-sim" type="button">Sim</button>
                    <button id="btn-nao" type="button" class="secundario">Não</button>
                </div>
            </div>
        </div>
    </div>
    <!-- O JavaScript é carregado por último, depois do HTML e do CSS -->
    <script src="script.js"></script>
</body>
</html>
