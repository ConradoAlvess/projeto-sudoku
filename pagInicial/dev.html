<!DOCTYPE html>
<html lang="pt-BR">
<head>

    <script src="https://kit.fontawesome.com/25b954d76c.js" crossorigin="anonymous"></script>
    <link rel="stylesheet" href="style.css">

    <style>
        /* Deixando toda a tela com margin 0 e backgroud marron */
        *{
            margin: 0;
            background-color:rgb(29, 28, 28);
        }

        /* Deixando os nomes com display grid e o texto alinhado a esquerda */
        .container-principal{
            display: grid;
            align-items: center;
            text-align: left;
        }

        /* Deixando o título h1 ao centro  */
        h1{
            text-align: center;
            color: bisque;
            font-size: 50px;
            font-family: 'Times New Roman', Times, serif;
        }
        
        /* Estilizando os h2 com os nomes dos devs */
        h2{
            padding: 40px;
            font-family: Cambria, Cochin, Georgia, Times, 'Times New Roman', serif;
            color: bisque;
            font-style: italic;
        }

        /* Alinhando os icons na mesma linha com o display inline */
        .container-icons{
            display: inline;
            margin: 0px 138px;
        }

        a{
            text-decoration: none;
            font-size: 25px;
        }

        /* Estilizando os ícons com backgroud e hover */
         .fa-linkedin{
            color: rgb(11, 11, 122);
            transition: 0.90s;
         }

         .fa-linkedin:hover{
            transform: scale(1.6);
         }

         .fa-github{
            color: rgb(10, 10, 10);
            transition: 0.90s;
         }

         .fa-github:hover{
            transform: scale(1.6);
         }

        /* Estilizando o hr */
        hr{
            border: none;
            height: 1px;
            background: #ddd;
            margin: 30px 0;
            box-shadow: 0 8px 10px 2px rgba(0,0,0,0.5);
         }

        /* Estilizando o footer */
        .footer{
        
        color: #fff;
        padding: 20px;
        text-align: center;
        box-shadow: 0 -10px 20px rgba(0,0,0,0.2);
        }

        .footer-links{
            margin: 25px 0;
        }

        .footer-links a{
            color: #fff;
            text-decoration: none;
            margin: 0 15px;
            transition: 0.3s;
        }

        .footer-links a:hover{
            color: bisque;
            padding-left: 4px;
        }

        .copyright{
            margin-top: 20px;
            font-size: 0.9rem;
            opacity: 0.7;
        }
    </style>
</head>
