<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sudoku</title>
    <link rel="stylesheet" href="styleIni.css">
</head>
<body>
    
    <!-- Container principal -->
     <main class="tela-inicial">
         
         <!-- Botão troca de tema -->
         <button id="temaClaroEscuro" class="btn-tema">
             🌙
            </button>
            
            <h1 class="titulo">SUDOKU</h1>
            
            <p class="descricao">
                Escolha uma dificuldade e desafie sua lógica.
            </p>
            
            <!-- Botão de novo jogo -->
            <button id="btnNovoJogo" class="btn-novo-jogo">
                Novo jogo
            </button>
            
            <!-- Menu de dificuldades do sudoku -->
            <div id="menuDificuldade" class="dificuldades">
                
                <button class="btn-dificuldade facil">
                    Fácil
                </button>
                
                <button class="btn-dificuldade medio">
                    Médio
                </button>
                
                <button class="btn-dificuldade dificil">
                    Difícil
                </button>
                
            </div>
            
            <button id="colaboradores" class="btn-colaboradores">
               <a href="dev.html">Desenvolvedores | todos os direitos reservados © 2026</a>
            </button>
     </main>
     <script src="script.js"></script>
</body>
</html>
