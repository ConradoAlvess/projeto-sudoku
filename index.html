<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sudoku</title>
</head>
<body>
    <div class="container">

        <h1 class="titulo-h1">Sudoku</h1>
        <div class="top">
        <select id="difficulty">
            <option value="easy">fácil</option>
            <option value="medium">Médio</option>
            <option value="hard">Difícil</option>
        </select>
        <span id="timer">00:00</span>    
        </div>
    
        <div id="board"></div>

        <div class="buttons">
            <button id="new game">Novo Jogo/button>
            <button id="undo">  Desfazer</button>
            <button id="erase">Apagar</button>
            <button id="hint">Dica</button>
            <button id="check">Veirifcar</button>
        </div>
        
        <p class="dicas">Dicas restantes: <span id="hints">3</span></p>
    
    
    </div>
</body>
</html>
