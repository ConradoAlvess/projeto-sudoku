<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sudoku</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Criação do container principal -->
    <div class="container">

        <h1 class="titulo-h1">Sudoku</h1>

        <!-- Div da barra supeior com a dificuldade e crônometro -->
        <div class="top">
            <select id="difficulty">
                <option value="easy">fácil</option>
                <option value="medium">Médio</option>
                <option value="hard">Difícil</option>
            </select>

            <span id="timer">00:00</span>    
        </div>
        
        <!-- Div onde o javascript cria as 81 célunas do Sudoku -->
        <div id="board"></div>

        <!-- Div onde agrupa os botões do site -->
        <div class="buttons">
            <button id="new game">Novo Jogo</button>
            <button id="undo">Desfazer</button>
            <button id="erase">Apagar</button>
            <button id="hint">Dica</button>
            <button id="check">Verificar</button>
        </div>
        
        <!-- Exibe o contador de dicas restantes -->
        <p class="dicas">Dicas restantes:<span id="hints">3</span></p>
    
    
    </div>
</body>
</html>
